name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The release command in fly.toml applies migrations before the new machines boot.
      # Migrations must stay backward compatible: the old worker is still running here.
      - name: Deploy
        run: flyctl deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Confirm the worker came back up
        run: |
          for attempt in $(seq 1 10); do
            state=$(flyctl status --app chessedu-worker --json | jq -r '[.Machines[].state] | unique | join(",")')
            echo "attempt $attempt: $state"
            if [ "$state" = "started" ]; then exit 0; fi
            sleep 10
          done
          echo "worker did not reach a started state"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Roll back a deploy that will not start
        if: failure()
        run: flyctl releases rollback --app chessedu-worker --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
